{% load i18n %}
{% if q|length >= 2 %}
<div class="glass glass--strong glass--sm p-2 max-h-96 overflow-y-auto">
  {% for icon, title, sub, url in results %}<a href="{{ url }}" class="flex items-center gap-3 rounded-lg px-3 py-2 hover:bg-ink/10"><span class="icon-tile w-8 h-8"><i data-lucide="{{ icon }}"></i></span><span class="min-w-0"><span class="block text-sm font-medium truncate">{{ title }}</span><span class="block text-[11px] text-ink-3">{{ sub }}</span></span></a>
  {% empty %}<p class="text-sm text-ink-3 px-3 py-4 text-center">{% trans "Hech narsa topilmadi" %}</p>{% endfor %}
</div>
{% endif %}
