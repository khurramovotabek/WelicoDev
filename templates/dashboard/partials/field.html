<div>{% if field.field.widget.input_type != "checkbox" %}<label class="field-label" for="{{ field.id_for_label }}">{{ label|default:field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>{% endif %}{{ field }}{% if field.help_text %}<p class="text-[11px] text-ink-3 mt-1">{{ field.help_text }}</p>{% endif %}{% for e in field.errors %}<p class="text-xs text-danger mt-1">{{ e }}</p>{% endfor %}</div>
