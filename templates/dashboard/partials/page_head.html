{% load i18n %}
<div class="flex flex-wrap items-end gap-3">
  <div class="mr-auto">
    <nav class="flex items-center gap-2 text-xs text-ink-3 mb-1"><a href="{% url 'dashboard:home' %}" class="hover:text-ink">Dashboard</a>{% if parent %}<i data-lucide="chevron-right" class="w-3 h-3"></i><a href="{{ parent_url }}" class="hover:text-ink">{{ parent }}</a>{% endif %}<i data-lucide="chevron-right" class="w-3 h-3"></i><span class="text-ink-2">{{ title }}</span></nav>
    <h1 class="text-3xl sm:text-4xl font-semibold">{{ title }}</h1>
    {% if subtitle %}<p class="text-sm text-ink-2 mt-1">{{ subtitle }}</p>{% endif %}
  </div>
  {% if action_url %}<a href="{{ action_url }}" class="btn btn-primary px-5 py-3"><i data-lucide="plus"></i>{{ action_label }}</a>{% endif %}
</div>
