{% if u.avatar %}<img src="{{ u.avatar.url }}" alt="" class="{{ size|default:'w-10 h-10' }} rounded-full object-cover shrink-0">{% else %}<span class="{{ size|default:'w-10 h-10' }} rounded-full shrink-0 grid place-items-center text-xs font-semibold bg-gradient-to-br from-accent/60 to-violet/60 text-white">{{ u.initials }}</span>{% endif %}
