{% load i18n %}<button type="button" class="btn btn-glass btn-sm {% if active %}!text-accent{% endif %}" hx-post="{% url 'interactions:react' kind obj.pk reaction %}" hx-swap="outerHTML" aria-pressed="{{ active|yesno:'true,false' }}">
  {% if reaction == "like" %}<i data-lucide="heart" class="{% if active %}fill-current{% endif %}"></i>{% if count is not None %}<span class="tabular">{{ count }}</span>{% endif %}{% else %}<i data-lucide="bookmark" class="{% if active %}fill-current{% endif %}"></i>{% if active %}{% trans "Saqlangan" %}{% else %}{% trans "Saqlash" %}{% endif %}{% endif %}
</button>
