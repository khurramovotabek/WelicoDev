{% load static %}<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Mini App preview</title>
<style>
  body{margin:0;min-height:100vh;display:flex;gap:40px;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 70% 0%,#2b3f7a,#070d24 60%);font-family:system-ui,sans-serif;color:#dfe7ff;flex-wrap:wrap;padding:24px}
  .phone{width:390px;height:844px;border-radius:54px;padding:12px;background:#0b0f1c;box-shadow:0 0 0 2px #2a3555,0 40px 90px -30px #000;position:relative}
  .phone iframe{width:100%;height:100%;border:0;border-radius:44px;background:#0b1530}
  .notch{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:120px;height:32px;border-radius:20px;background:#000;z-index:2}
  .side{max-width:320px;line-height:1.6}
  .side h1{font-size:22px;margin:0 0 8px}
  .side code{background:#ffffff1a;padding:2px 6px;border-radius:6px}
</style></head>
<body>
  <div class="phone"><div class="notch"></div><iframe src="{% if path %}{{ path }}{% else %}/{{ lang }}/app/?debug_user={{ debug_user }}{% endif %}" title="Mini App"></iframe></div>
  <div class="side">
    <h1>WeliCoDev Mini App</h1>
    <p>Lokal preview (390×844, iPhone 14). Telegram'da ochilganda foydalanuvchi initData imzosi bilan avtomatik kiradi.</p>
    <p>Tillar: <a style="color:#9fc0ff" href="?lang=uz">UZ</a> · <a style="color:#9fc0ff" href="?lang=ru">RU</a> · <a style="color:#9fc0ff" href="?lang=en">EN</a></p>
  </div>
</body></html>
